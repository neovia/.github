name: 🤖 Apex Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  apex-review:
    name: Apex — Review Neovia
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🔐 Se connecter au tailnet Neovia
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: 📤 Envoyer la PR à Apex
        env:
          WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
        run: |
          PAYLOAD=$(jq -nc \
            --arg action "${{ github.event.action }}" \
            --argjson number ${{ github.event.pull_request.number }} \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg body "${{ github.event.pull_request.body }}" \
            --arg login "${{ github.event.pull_request.user.login }}" \
            --arg head_ref "${{ github.event.pull_request.head.ref }}" \
            --arg base_ref "${{ github.event.pull_request.base.ref }}" \
            --arg html_url "${{ github.event.pull_request.html_url }}" \
            --arg full_name "${{ github.repository }}" \
            --argjson additions ${{ github.event.pull_request.additions }} \
            --argjson deletions ${{ github.event.pull_request.deletions }} \
            --argjson changed_files ${{ github.event.pull_request.changed_files }} \
            '{
              action: $action,
              pull_request: {
                number: $number,
                title: $title,
                body: $body,
                user: {login: $login},
                head: {ref: $head_ref},
                base: {ref: $base_ref},
                html_url: $html_url,
                additions: $additions,
                deletions: $deletions,
                changed_files: $changed_files
              },
              repository: {full_name: $full_name}
            }')

          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')

          HTTP_CODE=$(curl -s -w "%{http_code}" -X POST "http://100.66.114.90:8644/webhooks/neovia-pr-review" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -H "X-GitHub-Event: pull_request" \
            -d "$PAYLOAD")

          echo "✅ PR #${{ github.event.pull_request.number }} envoyée — HTTP $HTTP_CODE"

      - name: 💬 Notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🤖 **Apex** analyse cette PR… La review sera postée automatiquement dans quelques instants.'
            });
